# Same make targets as a local build. Every push and pull request: tests, lint and the image.
# A push to main with a VERSION whose chart is not in GHCR yet publishes it: image and chart, then the GitHub
# release v<version> with its tag (unless made by hand). Actions are pinned to commits; no caches, so a release never
# builds from cached files.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # creates the release
  packages: write # pushes image and chart

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26 # as in the Dockerfile
          package-manager-cache: false
      - run: npm ci --prefix frontend
      # make stops at the first failing target: no image when tests or lint fail.
      - run: make test lint image
      - if: github.event_name == 'push'
        run: |
          version="$(cat VERSION)"
          if helm show chart oci://ghcr.io/syntax3rror404/charts/kubedactyl --version "$version" >/dev/null 2>&1; then
            echo "$version is already published"; exit 0
          fi
          make push-image push-chart
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }} # also read by `gh auth token` in the Makefile
          GH_REPO: ${{ github.repository }}
