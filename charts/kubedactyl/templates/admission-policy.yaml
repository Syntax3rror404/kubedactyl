{{- if and .Values.rbac.create (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- $fullname := include "kubedactyl.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $prefix := printf "%s-user-" $ns }}
{{- $sa := include "kubedactyl.serviceAccountName" . }}
# Limits what the panel's service account can do with its cluster wide permissions, so a
# compromised panel cannot reach beyond its own namespaces: it may only manage its user
# namespaces (always with the Pod Security "baseline" level), their volumes and role bindings
# to its tenant role, its own CRDs, pods without service account tokens or host access, and
# (with self-upgrades) exactly the upgrade job. Checked by the API server; keep in sync with
# the panel code (tenancy, gameserver pods, selfupgrade.JobFor).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-panel
  labels:
    {{- include "kubedactyl.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: [namespaces, persistentvolumes, pods]
        operations: [CREATE, UPDATE, DELETE]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        resources: [rolebindings]
        operations: [CREATE, UPDATE, DELETE]
      - apiGroups: [apiextensions.k8s.io]
        apiVersions: ["*"]
        resources: [customresourcedefinitions]
        operations: [CREATE, UPDATE]
      - apiGroups: [batch]
        apiVersions: ["*"]
        resources: [jobs]
        operations: [CREATE, UPDATE]
  matchConditions:
    - name: panel-service-account
      expression: request.userInfo.username == "system:serviceaccount:{{ $ns }}:{{ $sa }}"
  variables:
    - name: resource
      expression: request.resource.resource
    - name: newPod
      expression: "variables.resource == 'pods' && request.operation != 'DELETE'"
    {{- if include "kubedactyl.selfUpgrade" . }}
    - name: upgradeJob
      expression: >-
        request.namespace == "{{ $ns }}" &&
        object.spec.template.spec.serviceAccountName == "{{ include "kubedactyl.upgraderName" . }}" &&
        !has(object.spec.template.spec.hostNetwork) && !has(object.spec.template.spec.hostPID) && !has(object.spec.template.spec.hostIPC) &&
        !has(object.spec.template.spec.initContainers) && object.spec.template.spec.containers.size() == 1 &&
        (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v, has(v.emptyDir))) &&
        object.spec.template.spec.containers.all(c,
          c.image == "{{ include "kubedactyl.image" . }}" && !has(c.command) && !has(c.envFrom) &&
          (!has(c.env) || c.env.all(e, e.name == 'HOME')) &&
          (!has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) &&
          c.args.size() == 9 && c.args[0] == 'upgrade' &&
          c.args[1] == '--release' && c.args[2] == "{{ .Release.Name }}" &&
          c.args[3] == '--release-namespace' && c.args[4] == "{{ $ns }}" &&
          c.args[5] == '--chart' && c.args[6] == "{{ .Values.selfUpgrade.chart }}" &&
          c.args[7] == '--version' && c.args[8].matches('^[0-9A-Za-z.+-]+$'))
    {{- end }}
  validations:
    - expression: "variables.resource != 'namespaces' || request.name == '{{ $ns }}' || request.name.startsWith('{{ $prefix }}')"
      message: the panel may only manage its own user namespaces
    - expression: >-
        variables.resource != 'namespaces' || request.operation == 'DELETE' || request.name == '{{ $ns }}' ||
        (has(object.metadata.labels) && 'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
         object.metadata.labels['pod-security.kubernetes.io/enforce'] in ['baseline', 'restricted'])
      message: user namespaces must enforce the Pod Security baseline level
    - expression: >-
        variables.resource != 'persistentvolumes' || (request.operation == 'UPDATE' &&
        has(oldObject.spec.claimRef) && has(oldObject.spec.claimRef.namespace) && oldObject.spec.claimRef.namespace.startsWith('{{ $prefix }}') &&
        has(object.spec.claimRef) && has(object.spec.claimRef.namespace) && object.spec.claimRef.namespace.startsWith('{{ $prefix }}'))
      message: the panel may only change volumes of its user namespaces
    - expression: >-
        variables.resource != 'rolebindings' || (request.namespace.startsWith('{{ $prefix }}') && (request.operation == 'DELETE' ||
        (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == '{{ $fullname }}-tenant' && has(object.subjects) &&
         object.subjects.all(s, s.kind == 'ServiceAccount' && s.name == '{{ $sa }}' && s.namespace == '{{ $ns }}'))))
      message: the panel may only grant itself its tenant role in its user namespaces
    - expression: "variables.resource != 'customresourcedefinitions' || object.spec.group == 'kubedactyl.io'"
      message: the panel may only install its own CRDs
    - expression: >-
        !variables.newPod || ((!has(object.spec.serviceAccountName) || object.spec.serviceAccountName == 'default') &&
        has(object.spec.automountServiceAccountToken) && !object.spec.automountServiceAccountToken)
      message: pods of the panel may not use a service account token
    - expression: >-
        !variables.newPod || (
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC) &&
        (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))) &&
        object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        (!has(object.spec.initContainers) ||
         object.spec.initContainers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)))
      message: pods of the panel may not use host namespaces, host paths or privileged containers
    - expression: "variables.resource != 'jobs' || {{ if include "kubedactyl.selfUpgrade" . }}variables.upgradeJob{{ else }}false{{ end }}"
      message: the panel may only start its upgrade job
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-panel
  labels:
    {{- include "kubedactyl.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-panel
  validationActions: [Deny]
{{- end }}
