apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubedactyl.fullname" . }}
  labels:
    {{- include "kubedactyl.labels" . | nindent 4 }}
spec:
  # Exactly one replica: the controllers run without leader election and file activity is
  # kept in memory.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubedactyl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubedactyl.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # Without a kubeconfig the panel uses this service account (in-cluster config).
      serviceAccountName: {{ include "kubedactyl.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubedactyl
          image: {{ include "kubedactyl.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KUBEDACTYL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.rbac.create }}
            # Writes in user namespaces go through this role, bound there by the panel.
            - name: KUBEDACTYL_TENANT_ROLE
              value: {{ printf "%s-tenant" (include "kubedactyl.fullname" .) | quote }}
            - name: KUBEDACTYL_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            {{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
            - name: KUBEDACTYL_ADMISSION_POLICY
              value: {{ printf "%s-panel" (include "kubedactyl.fullname" .) | quote }}
            {{- end }}
            {{- end }}
            - name: STORAGE_CLASS
              value: {{ .Values.panel.storageClass | quote }}
            - name: LB_POOL
              value: {{ .Values.panel.loadBalancerPool | quote }}
            - name: HELPER_IMAGE
              value: {{ .Values.panel.helperImage | quote }}
            - name: TZ
              value: {{ .Values.panel.timezone | quote }}
            - name: DOCKER_INTERFACE
              value: {{ .Values.panel.dockerInterface | quote }}
            {{- with .Values.panel.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.panel.verbose }}
            - name: VERBOSE
              value: "1"
            {{- end }}
            {{- if include "kubedactyl.hasSecret" . }}
            - name: KUBEDACTYL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubedactyl.secretName" . }}
                  key: admin-password
                  optional: true
            - name: KUBEDACTYL_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubedactyl.secretName" . }}
                  key: setup-token
                  optional: true
            {{- end }}
            {{- if include "kubedactyl.selfUpgrade" . }}
            - name: KUBEDACTYL_HELM_RELEASE
              value: {{ .Release.Name | quote }}
            - name: KUBEDACTYL_UPGRADE_CHART
              value: {{ .Values.selfUpgrade.chart | quote }}
            - name: KUBEDACTYL_UPGRADE_SERVICE_ACCOUNT
              value: {{ include "kubedactyl.upgraderName" . | quote }}
            - name: KUBEDACTYL_IMAGE
              value: {{ include "kubedactyl.image" . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
