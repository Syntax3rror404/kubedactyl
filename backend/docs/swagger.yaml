      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: Archive
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.DecompressFileRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/files.Job'
      security:
      - BearerAuth: []
      summary: Extract an archive (zip, tar, tar.gz, tar.xz)
      tags:
      - Files
  /servers/{server}/files/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: Entries
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.FilesRequest'
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete files and folders
