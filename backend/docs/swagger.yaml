  /users/{user}:
    delete:
      description: Deletes the user, all its game servers, their data and the user
        namespace.
      parameters:
      - description: Username
        in: path
        name: user
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - Users
    get:
      parameters:
      - description: Username
        in: path
        name: user
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.UserView'
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - Users
    patch:
      consumes:
      - application/json
      parameters:
      - description: Username
        in: path
        name: user
        required: true
        type: string
      - description: Changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.UserView'
        "409":
          description: last administrator, or managed by the identity provider
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a user
      tags:
      - Users
  /versions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Versions'
      security:
      - BearerAuth: []
      summary: Software versions
      tags:
      - System
securityDefinitions:
  BearerAuth:
    description: |-
      "Bearer <token>": a session token from /auth/login or an API token (kdt_…). The web UI
      uses the kd_session cookie.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
