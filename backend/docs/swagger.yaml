basePath: /api
definitions:
  checks.Check:
    properties:
      id:
        example: metrics
        type: string
      label:
        example: Metrics server
        type: string
      message:
        example: metrics.k8s.io is not available, no CPU and memory usage
        type: string
      status:
        allOf:
        - $ref: '#/definitions/checks.Status'
        enum:
        - ok
        - warning
        - error
        - skipped
    required:
    - id
    - label
    - status
    type: object
  checks.Status:
    enum:
    - ok
    - warning
    - error
    - skipped
    type: string
    x-enum-varnames:
    - OK
    - Warning
    - Error
    - Skipped
  clusterinfo.Auth:
    properties:
      authProvider:
        type: string
      clientCertificate:
        $ref: '#/definitions/clusterinfo.CertInfo'
      execApiVersion:
        type: string
      execArgs:
        example:
        - oidc-login
        - get-token
        items:
          type: string
        type: array
      execCommand:
        example: kubectl
        type: string
      impersonating:
        type: string
      method:
        description: 'Method: client-certificate, token, exec, auth-provider, basic,
          service-account or none.'
        example: exec
        type: string
      tokenPreview:
        example: eyJh…Qw
        type: string
    required:
    - method
    type: object
  clusterinfo.CPUModelCount:
    properties:
      count:
        example: 6
        type: integer
      model:
        example: AMD Ryzen 7 5700U with Radeon Graphics
        type: string
    required:
    - count
    - model
    type: object
  clusterinfo.CertInfo:
    properties:
      issuer:
        example: CN=kubernetes
        type: string
      notAfter:
        type: string
      notBefore:
        type: string
      subject:
        example: CN=kubernetes
        type: string
    required:
    - issuer
    - notAfter
    - notBefore
    - subject
    type: object
  clusterinfo.Hardware:
    properties:
      bios:
        example: M5 Pro 1.03
        type: string
      board:
        type: string
      cpuCores:
        example: 8
        type: integer
      cpuMaxMHz:
        example: 4374
        type: integer
      cpuModel:
        example: AMD Ryzen 7 5700U with Radeon Graphics
        type: string
      cpuSockets:
        example: 1
        type: integer
      cpuThreads:
        example: 16
        type: integer
      memoryBytes:
        example: 66750640128
        type: integer
      product:
        example: M5 Pro
        type: string
      productVersion:
        example: Version 1.0
        type: string
      vendor:
        example: GMKtec
        type: string
      virtualized:
        description: Virtualized is true when the CPU reports the "hypervisor" flag
          (VM instead of bare metal).
        type: boolean
    required:
    - cpuCores
    - cpuMaxMHz
    - cpuModel
    - cpuSockets
    - cpuThreads
    - memoryBytes
    - virtualized
    type: object
  clusterinfo.Health:
    properties:
      checkedAt:
        type: string
      checks:
        items:
          $ref: '#/definitions/checks.Check'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/checks.Status'
        enum:
        - ok
        - warning
        - error
    required:
    - checkedAt
    - checks
    - status
    type: object
  clusterinfo.Identity:
    properties:
      auth:
        $ref: '#/definitions/clusterinfo.Auth'
      kubeconfig:
        $ref: '#/definitions/clusterinfo.Kubeconfig'
      mode:
        description: Mode is "kubeconfig" or "in-cluster".
        example: kubeconfig
        type: string
      permissions:
        items:
          $ref: '#/definitions/clusterinfo.Permission'
        type: array
      platform:
        example: linux/amd64
        type: string
      protocol:
        example: HTTP/1.1
        type: string
      server:
        example: https://k8s.example.com:6443
        type: string
      serviceAccount:
        $ref: '#/definitions/clusterinfo.ServiceAccount'
      subject:
        $ref: '#/definitions/clusterinfo.Subject'
      subjectError:
        type: string
      tls:
        $ref: '#/definitions/clusterinfo.TLS'
      version:
        example: v1.36.4
        type: string
    required:
    - auth
    - mode
    - permissions
    - platform
    - protocol
    - server
    - tls
    - version
    type: object
  clusterinfo.Kubeconfig:
    properties:
      cluster:
        example: my-cluster
        type: string
      context:
        example: my-cluster
        type: string
      contexts:
        description: Contexts lists the names of all contexts in the kubeconfig.
        items:
          type: string
        type: array
      files:
        example:
        - /home/user/.kube/config
        items:
          type: string
        type: array
      namespace:
        type: string
      user:
        example: oidc-user
        type: string
    required:
    - cluster
    - context
    - contexts
    - files
    - user
    type: object
  clusterinfo.Node:
    properties:
      architecture:
        example: amd64
        type: string
      containerRuntime:
        example: containerd://2.3.5
        type: string
      cpuAllocatableMillis:
        type: integer
      cpuCapacityMillis:
        example: 16000
        type: integer
      cpuRequestedMillis:
        type: integer
      createdAt:
        type: string
      ephemeralStorageBytes:
        type: integer
      hardware:
        $ref: '#/definitions/clusterinfo.Hardware'
      hardwareError:
        type: string
      hardwareProbedAt:
        type: string
      hardwareProbing:
        type: boolean
      internalIP:
        example: 192.168.1.41
        type: string
      kernelVersion:
        example: 6.18.51-talos
        type: string
      kubeletVersion:
        example: v1.36.4
        type: string
      memoryAllocatableBytes:
        type: integer
      memoryCapacityBytes:
        type: integer
      memoryRequestedBytes:
        type: integer
      name:
        example: node-1
        type: string
      osImage:
        example: Talos (v1.14.1)
        type: string
      podsCapacity:
        example: 110
        type: integer
      podsRunning:
        example: 42
        type: integer
      pressure:
        example:
        - MemoryPressure
        items:
          type: string
        type: array
      ready:
        type: boolean
      roles:
        example:
        - control-plane
        items:
          type: string
        type: array
      status:
        example: Ready
        type: string
      taints:
        items:
          type: string
        type: array
      unschedulable:
        type: boolean
      usage:
        $ref: '#/definitions/clusterinfo.Usage'
    required:
    - architecture
    - containerRuntime
    - cpuAllocatableMillis
    - cpuCapacityMillis
    - cpuRequestedMillis
    - createdAt
    - ephemeralStorageBytes
    - hardwareProbing
    - internalIP
    - kernelVersion
    - kubeletVersion
    - memoryAllocatableBytes
    - memoryCapacityBytes
    - memoryRequestedBytes
    - name
    - osImage
    - podsCapacity
    - podsRunning
    - pressure
    - ready
    - roles
    - status
    - taints
    - unschedulable
    type: object
  clusterinfo.NodesResponse:
    properties:
      nodes:
        items:
          $ref: '#/definitions/clusterinfo.Node'
        type: array
      totals:
        $ref: '#/definitions/clusterinfo.Totals'
    required:
    - nodes
    - totals
    type: object
  clusterinfo.Permission:
    properties:
      allowed:
        type: boolean
      group:
        example: metrics.k8s.io
        type: string
      label:
        example: Exec into pods
        type: string
      namespace:
        type: string
      resource:
        example: pods/exec
        type: string
      verb:
        example: create
        type: string
    required:
    - allowed
    - label
    - resource
    - verb
    type: object
  clusterinfo.ServiceAccount:
    properties:
      audiences:
        items:
          type: string
        type: array
      name:
        example: kubedactyl
        type: string
      namespace:
        example: kubedactyl
        type: string
      tokenExpiresAt:
        type: string
    required:
    - name
    - namespace
    type: object
  clusterinfo.Subject:
    properties:
      extra:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      groups:
        example:
        - oidc:kube-admins
        items:
          type: string
        type: array
      uid:
        type: string
      username:
        example: oidc:alice
        type: string
    required:
    - groups
    - username
    type: object
  clusterinfo.TLS:
    properties:
      ca:
        $ref: '#/definitions/clusterinfo.CertInfo'
      caSource:
        description: CASource is "kubeconfig", "file", "system" (no CA configured)
          or "service-account".
        example: kubeconfig
        type: string
      insecure:
        type: boolean
      serverName:
        type: string
    required:
    - caSource
    - insecure
    type: object
  clusterinfo.Totals:
    properties:
      cpuCapacityMillis:
        type: integer
      cpuModels:
        items:
          $ref: '#/definitions/clusterinfo.CPUModelCount'
        type: array
      cpuRequestedMillis:
        type: integer
      cpuUsedMillis:
        type: integer
      memoryCapacityBytes:
        type: integer
      memoryRequestedBytes:
        type: integer
      memoryUsedBytes:
        type: integer
      metricsAvailable:
        description: MetricsAvailable is false when metrics-server does not answer.
        type: boolean
      nodes:
        type: integer
      physicalCores:
        type: integer
      podsCapacity:
        type: integer
      podsRunning:
        type: integer
      readyNodes:
        type: integer
    required:
    - cpuCapacityMillis
    - cpuModels
    - cpuRequestedMillis
    - cpuUsedMillis
    - memoryCapacityBytes
    - memoryRequestedBytes
    - memoryUsedBytes
    - metricsAvailable
    - nodes
    - physicalCores
    - podsCapacity
    - podsRunning
    - readyNodes
    type: object
  clusterinfo.Usage:
    properties:
      cpuMillis:
        example: 1250
        type: integer
      memoryBytes:
        example: 12884901888
        type: integer
    required:
    - cpuMillis
    - memoryBytes
    type: object
  egglibrary.Egg:
    properties:
      author:
        type: string
      description:
        type: string
      format:
        type: string
      icon:
        type: string
      name:
        type: string
      path:
        description: Path of the file in the repository.
        type: string
      repository:
        description: Repository is the GitHub repository (https://github.com/<owner>/<repo>).
        type: string
      tags:
        items:
          type: string
        type: array
      url:
        description: 'URL of the raw file: installing imports it from there and keeps
          it as update URL.'
        type: string
      uuid:
        type: string
    required:
    - author
    - description
    - format
    - name
    - path
    - repository
    - tags
    - url
    - uuid
    type: object
  egglibrary.Repository:
    properties:
      eggs:
        items:
          $ref: '#/definitions/egglibrary.Egg'
        type: array
      error:
        description: Error tells why the repository could not be read (its eggs are
          then missing).
        type: string
      fetchedAt:
        type: string
      url:
        type: string
    required:
    - eggs
    - fetchedAt
    - url
    type: object
  files.Entry:
    properties:
      isDirectory:
        type: boolean
      isSymlink:
        type: boolean
      mode:
        type: string
      modifiedAt:
        type: string
      name:
        type: string
      size:
        type: integer
    required:
    - isDirectory
    - isSymlink
    - mode
    - modifiedAt
    - name
    - size
    type: object
  files.Job:
    properties:
      error:
        type: string
      finishedAt:
        type: string
      id:
        type: string
      kind:
        enum:
        - pull
        - backup
        - restore
        - compress
        - decompress
        type: string
      label:
        type: string
      progress:
        allOf:
        - $ref: '#/definitions/files.Progress'
        description: Progress of a running job, once known.
        x-nullable: true
      startedAt:
        type: string
      state:
        description: State is running, done, failed or cancelled.
        enum:
        - running
        - done
        - failed
        - cancelled
        type: string
    required:
    - id
    - kind
    - label
    - startedAt
    - state
    type: object
  files.Progress:
    properties:
      done:
        type: integer
      file:
        type: string
      startedAt:
        type: string
      total:
        type: integer
      unit:
        enum:
        - files
        - bytes
        type: string
    required:
    - done
    - startedAt
    - total
    - unit
    type: object
  httpapi.AcceptInviteRequest:
    properties:
      displayName:
        example: Alice
        type: string
      password:
        example: a-long-password
        type: string
      token:
        type: string
      username:
        description: Username is ignored when the invite names one.
        example: alice
        type: string
    required:
    - password
    - token
    type: object
  httpapi.Backup:
    properties:
      createdAt:
        type: string
      name:
        example: backup-2026-09-29_040000.tar.gz
        type: string
      path:
        description: Path is the file manager path (download with /files/download?file=…).
        example: /.backups/backup-2026-09-29_040000.tar.gz
        type: string
      size:
        type: integer
    required:
    - createdAt
    - name
    - path
    - size
    type: object
  httpapi.BackupList:
    properties:
      items:
        items:
          $ref: '#/definitions/httpapi.Backup'
        type: array
    required:
    - items
    type: object
  httpapi.Branding:
    properties:
      favicon:
        type: string
      logo:
        type: string
      name:
        example: Kubedactyl
        type: string
      tagline:
        example: Game servers on Kubernetes
        type: string
    required:
    - name
    - tagline
    type: object
  httpapi.ClusterInfo:
    properties:
      context:
        example: my-cluster
        type: string
      loadBalancerPool:
        example: general-pool
        type: string
      namespace:
        example: kubedactyl
        type: string
      server:
        example: https://k8s.example.com:6443
        type: string
      storageClass:
        description: StorageClass and LoadBalancerPool are the defaults of the panel
          settings.
        example: longhorn
        type: string
      version:
        example: v1.36.4
        type: string
    required:
    - context
    - loadBalancerPool
    - namespace
    - server
    - storageClass
    - version
    type: object
  httpapi.CommandRequest:
    properties:
      command:
        example: say Hello
        type: string
    required:
    - command
    type: object
  httpapi.CreateBackupRequest:
    properties:
      label:
        description: Label is appended to the archive name.
        example: before-update
        type: string
    type: object
  httpapi.CreateFolderRequest:
    properties:
      name:
        example: plugins
        type: string
      root:
        example: /
        type: string
    required:
    - name
    type: object
  httpapi.CreateInviteRequest:
    properties:
      note:
        example: Alice from the Discord server
        type: string
      role:
        allOf:
        - $ref: '#/definitions/v1alpha1.UserRole'
        enum:
        - admin
        - user
        example: user
      username:
        example: alice
        type: string
    type: object
  httpapi.CreateServerRequest:
    properties:
      cpuMillis:
        example: 2000
        type: integer
      diskMiB:
        example: 10240
        type: integer
      displayName:
        example: Survival
        type: string
      egg:
        example: paper
        type: string
      environment:
        additionalProperties:
          type: string
        type: object
      externalTrafficPolicy:
        allOf:
        - $ref: '#/definitions/v1alpha1.TrafficPolicy'
        description: 'ExternalTrafficPolicy of the service (default Local: the server
          sees the players'' IPs).'
        enum:
        - Local
        - Cluster
      image:
        example: ghcr.io/pelican-eggs/yolks:java_21
        type: string
      loadBalancerIP:
        description: LoadBalancerIP optionally requests a fixed IP from the pool.
        example: 192.168.1.70
        type: string
      loadBalancerPool:
        description: 'LoadBalancerPool the address comes from (default: the default
          of the panel settings).'
        example: general-pool
        type: string
      memoryMiB:
        example: 4096
        type: integer
      owner:
        description: 'Owner is the username the server belongs to (default: the calling
          admin).'
        example: alice
        type: string
      ports:
        example:
        - 25565
        items:
          type: integer
        type: array
      skipInstall:
        type: boolean
      startOnCompletion:
        description: StartOnCompletion starts the server once the installation is
          finished.
        example: true
        type: boolean
      startup:
        type: string
      storageClass:
        description: 'StorageClass of the data volume (default: the default of the
          panel settings).'
        example: longhorn
        type: string
    required:
    - diskMiB
    - displayName
    - egg
    - memoryMiB
    - ports
    type: object
  httpapi.CreateTokenRequest:
    properties:
      expiresInDays:
        description: 'ExpiresInDays is the lifetime: 1 up to the longest API token
          lifetime of the panel.'
        example: 90
        type: integer
      name:
        example: ci
        type: string
    required:
    - expiresInDays
    - name
    type: object
  httpapi.CreateUserRequest:
    properties:
      displayName:
        example: Alice
        type: string
      email:
        example: alice@example.com
        type: string
      mustChangePassword:
        description: MustChangePassword makes the user replace the password after
          signing in.
        type: boolean
      password:
        example: a-long-password
        type: string
      role:
        allOf:
        - $ref: '#/definitions/v1alpha1.UserRole'
        enum:
        - admin
        - user
        example: user
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  httpapi.CreatedInvite:
    properties:
      createdAt:
        type: string
      createdBy:
        example: admin
        type: string
      expired:
        description: Expired invites stay listed until they are revoked; their link
          no longer works.
        type: boolean
      expiresAt:
        type: string
      id:
        example: 1a2b3c4d5e6f
        type: string
      note:
        example: Alice from the Discord server
        type: string
      role:
        allOf:
        - $ref: '#/definitions/v1alpha1.UserRole'
        enum:
        - admin
        - user
        example: user
      token:
        example: 1a2b3c4d5e6f.…
        type: string
      username:
        description: Username is the name the account gets; empty lets the invited
          person choose it.
        example: alice
        type: string
    required:
    - createdAt
    - expired
    - expiresAt
    - id
    - role
    - token
    type: object
  httpapi.CreatedToken:
    properties:
      createdAt:
        type: string
      expiresAt:
        description: 'ExpiresAt is the end of the token: its own expiry or the longest
          API token lifetime of the panel.'
        type: string
      id:
        example: 1a2b3c4d5e6f
        type: string
      name:
        example: ci
        type: string
      token:
        example: kdt_1a2b3c4d5e6f_…
        type: string
    required:
    - createdAt
    - expiresAt
    - id
    - name
    - token
    type: object
  httpapi.DecompressFileRequest:
    properties:
      file:
        example: world.zip
        type: string
      root:
        example: /
        type: string
    required:
    - file
    type: object
  httpapi.EggList:
    properties:
      items:
        items:
          $ref: '#/definitions/v1alpha1.Egg'
        type: array
    required:
    - items
    type: object
  httpapi.ErrorResponse:
    properties:
      error:
        example: server not found
        type: string
      fields:
        additionalProperties:
          type: string
        description: Fields holds validation errors per field or variable.
        type: object
    required:
    - error
    type: object
  httpapi.FileList:
    properties:
      directory:
        example: /
        type: string
      items:
        items:
          $ref: '#/definitions/files.Entry'
        type: array
    required:
    - directory
    - items
    type: object
  httpapi.FilesRequest:
    properties:
      files:
        example:
        - world
        - logs
        items:
          type: string
        type: array
      root:
        example: /
        type: string
    required:
    - files
    type: object
  httpapi.FilesSession:
    properties:
      error:
        type: string
      idleTimeoutSeconds:
        example: 60
        type: integer
      message:
        description: Message explains a Starting state (e.g. "ContainerCreating").
        type: string
      ready:
        type: boolean
      state:
        description: State is Stopped, Starting, Ready or Stopping.
        enum:
        - Stopped
        - Starting
        - Ready
        - Stopping
        example: Starting
        type: string
      stopsInSeconds:
        description: |-
          StopsInSeconds is how long a ready container stays without further file operations
          (reading the session does not count as one).
        example: 42
        type: integer
    required:
    - idleTimeoutSeconds
    - ready
    - state
    type: object
  httpapi.GameServerList:
    properties:
      items:
        items:
          $ref: '#/definitions/v1alpha1.GameServer'
        type: array
    required:
    - items
    type: object
  httpapi.ImportURLRequest:
    properties:
      autoUpdate:
        description: AutoUpdate turns the hourly update from the URL on (an egg imported
          again keeps it on).
        type: boolean
      url:
        example: https://raw.githubusercontent.com/pelican-eggs/minecraft/main/java/paper/egg-paper.json
        type: string
    required:
    - url
    type: object
  httpapi.InviteDetails:
    properties:
      expiresAt:
        type: string
      username:
        description: Username is set when the administrator chose the name; the invited
          person cannot change it.
        example: alice
        type: string
    required:
    - expiresAt
    type: object
  httpapi.InviteView:
    properties:
      createdAt:
        type: string
      createdBy:
        example: admin
        type: string
      expired:
        description: Expired invites stay listed until they are revoked; their link
          no longer works.
        type: boolean
      expiresAt:
        type: string
      id:
        example: 1a2b3c4d5e6f
        type: string
      note:
        example: Alice from the Discord server
        type: string
      role:
        allOf:
        - $ref: '#/definitions/v1alpha1.UserRole'
        enum:
        - admin
        - user
        example: user
      username:
        description: Username is the name the account gets; empty lets the invited
          person choose it.
        example: alice
        type: string
    required:
    - createdAt
    - expired
    - expiresAt
    - id
    - role
    type: object
  httpapi.JobList:
    properties:
      items:
        items:
          $ref: '#/definitions/files.Job'
        type: array
    required:
    - items
    type: object
  httpapi.LegalTexts:
    properties:
      legalNotice:
        type: string
      privacyPolicy:
        type: string
    required:
    - legalNotice
    - privacyPolicy
    type: object
  httpapi.LibraryEgg:
    properties:
      egg:
        $ref: '#/definitions/egglibrary.Egg'
      spec:
        $ref: '#/definitions/v1alpha1.EggSpec'
    required:
    - egg
    - spec
    type: object
  httpapi.LibraryList:
    properties:
      repositories:
        items:
          $ref: '#/definitions/egglibrary.Repository'
        type: array
    required:
    - repositories
    type: object
  httpapi.LoginRequest:
    properties:
      password:
        example: secret-password
        maxLength: 1024
        type: string
      username:
        description: |-
          The maximum lengths (usernames have at most 32 characters, auth.MaxPasswordLength) keep a request from
          filling the limiters and the log with huge keys.
        example: admin
        maxLength: 64
        type: string
    required:
    - password
    - username
