          $ref: '#/definitions/httpapi.CreateFolderRequest'
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Create a folder
      tags:
      - Files
  /servers/{server}/files/decompress:
    post:
      consumes:
      - application/json
