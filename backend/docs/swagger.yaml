      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: State
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.SuspendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1alpha1.GameServer'
      security:
      - BearerAuth: []
