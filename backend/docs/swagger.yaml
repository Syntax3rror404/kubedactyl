    post:
      description: |-
        Stops the server and runs the egg install script again. Files are kept unless the script removes
        them.
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
