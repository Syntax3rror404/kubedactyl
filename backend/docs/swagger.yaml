      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.BackupList'
      security:
      - BearerAuth: []
      summary: Backups of a server
      tags:
      - Backups
    post:
      consumes:
      - application/json
      description: |-
        Packs all server files except the backup folder into a tar.gz in the background. Works while the
        server runs.
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: Label
        in: body
        name: body
        schema:
          $ref: '#/definitions/httpapi.CreateBackupRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/files.Job'
        "409":
          description: a backup or restore is running
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a backup
      tags:
      - Backups
  /servers/{server}/backups/{backup}:
    delete:
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: Backup file name
        in: path
        name: backup
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a backup
      tags:
      - Backups
  /servers/{server}/backups/{backup}/restore:
    post:
      description: |-
        Deletes all server files except the backup folder and extracts the backup. The server must be
        stopped; it cannot be started until the restore has finished.
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: Backup file name
        in: path
        name: backup
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/files.Job'
        "409":
          description: server running or job in progress
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore a backup
      tags:
      - Backups
  /servers/{server}/command:
    post:
      consumes:
      - application/json
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: Command
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.CommandRequest'
      responses:
        "204":
          description: No Content
        "409":
          description: server is not running
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send a console command
      tags:
      - Servers
  /servers/{server}/diagnostics:
    get:
      description: |-
        Checks the typical causes why players cannot connect: installation, state, pending restart, disk
        space, load balancer address, DNS A/AAAA records of the external domain and the router forwarding
        (TCP, tested from inside the network). Users do not see the load balancer IP.
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
