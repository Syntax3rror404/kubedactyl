      tags:
      - Servers
  /servers/{server}/schedules:
    get:
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ScheduleList'
      security:
      - BearerAuth: []
      summary: Schedules of a server
      tags:
      - Schedules
    put:
      consumes:
      - application/json
      description: |-
        Cron expressions (5 fields or @daily, @hourly, …) use the panel time zone. Tasks run one after
        another; the delay waits before a task.
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: Schedules
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.UpdateSchedulesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ScheduleList'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace the schedules of a server
      tags:
      - Schedules
  /servers/{server}/schedules/{schedule}/run:
    post:
      description: Starts the tasks in the background (also for disabled schedules).
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: Schedule name
        in: path
        name: schedule
        required: true
        type: string
      responses:
        "202":
          description: Accepted
