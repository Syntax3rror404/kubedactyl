      - Backups
  /servers/{server}/power:
    post:
      consumes:
      - application/json
      description: |-
        start, stop (egg stop command or signal, killed after the stop timeout), restart, kill (immediate
        SIGKILL).
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      - description: Power action
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.PowerRequest'
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
