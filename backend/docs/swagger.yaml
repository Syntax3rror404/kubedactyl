        description: |-
          Cron is a five-field cron expression ("0 4 * * *") or a descriptor like "@daily",
          evaluated in the panel's time zone. Either Cron or Event is set.
          +optional
        type: string
      enabled:
        description: Enabled schedules run automatically; disabled ones can still
          be run by hand.
        type: boolean
      event:
        description: |-
          Event runs the schedule when the server was marked as running ("started") or before it
          is stopped or restarted ("stopping"; the stop waits until the tasks are done).
          +optional
          +kubebuilder:validation:Enum=started;stopping
        enum:
        - started
        - stopping
        type: string
      name:
        description: |-
          Name identifies the schedule within the server.
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=50
        type: string
      onlyWhenOnline:
        description: |-
          OnlyWhenOnline skips the run when the server is not running.
          +optional
        type: boolean
      tasks:
        description: |-
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=10
        items:
          $ref: '#/definitions/v1alpha1.ScheduleTask'
        type: array
    required:
    - enabled
    - name
    - tasks
    type: object
  v1alpha1.ScheduleStatus:
    properties:
      lastResult:
        description: 'LastResult is "ok", "skipped: …" or "failed: …".'
        type: string
      lastRunAt:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  v1alpha1.ScheduleTask:
    properties:
      action:
        description: |-
          Action is a console command, a power action or a backup.
          +kubebuilder:validation:Enum=command;start;stop;restart;kill;backup
        enum:
        - command
        - start
        - stop
        - restart
        - kill
        - backup
        type: string
      delaySeconds:
        description: |-
          DelaySeconds waits before this task (after the previous one).
          +optional
          +kubebuilder:validation:Minimum=0
          +kubebuilder:validation:Maximum=900
        type: integer
      payload:
        description: |-
          Payload is the console command (action "command") or the backup label (action "backup").
          +optional
          +kubebuilder:validation:MaxLength=500
        type: string
    required:
    - action
    type: object
  v1alpha1.TrafficPolicy:
    enum:
    - Local
    - Cluster
    type: string
    x-enum-varnames:
    - TrafficLocal
    - TrafficCluster
  v1alpha1.UserRole:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
info:
  contact: {}
  description: Game server panel for Kubernetes that runs Pterodactyl and Pelican
    eggs.
  title: Kubedactyl API
  version: dev
paths:
  /auth/invite:
    get:
      description: 'Public: tells the invite page whether the link works and whether
        the username is fixed.'
      parameters:
      - description: Token of the invite link
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.InviteDetails'
        "404":
          description: unknown, used or expired link
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Check an invite link
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: 'Public: creates the account of an invite link (the link works
        once) and signs it in.'
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.AcceptInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.LoginResponse'
        "404":
          description: unknown, used or expired link
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Accept an invite
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Returns a session token and sets it as HttpOnly cookie. Repeated
        failures are throttled.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Log in
      tags:
      - Auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Log out (ends the session and clears its cookie)
      tags:
      - Auth
  /auth/logout-all:
    post:
      description: |-
        Invalidates every session of the user (including this one). API tokens stay valid; revoke them
        separately.
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Sign out on all devices
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.UserView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Auth
  /auth/oidc:
    get:
      description: 'Public: whether users can sign in through an OpenID Connect identity
        provider.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.OIDCSignIn'
      summary: Single sign-on of the sign-in page
      tags:
      - Auth
  /auth/oidc/callback:
    get:
      description: |-
        Public, opened by the browser: verifies the sign-in, starts a session (cookie) and redirects to
        the page the sign-in started from. The account is the one linked to the user of the identity
        provider, else the one with the same username, else a new one. Failures redirect to
        /login?sso=<reason> (access: in no group with access or disabled, account: the account cannot be
        used, failed).
      parameters:
      - description: Authorization code
        in: query
        name: code
        type: string
      - description: State of the sign-in
        in: query
        name: state
        type: string
      responses:
        "302":
          description: Found
      summary: Callback of the identity provider
      tags:
      - Auth
  /auth/oidc/start:
    get:
      description: |-
        Public, opened by the browser: redirects to the sign-in page of the identity provider, which
        returns to /auth/oidc/callback. Failures redirect to /login?sso=failed.
      parameters:
      - description: Page of the panel to open after the sign-in
        in: query
        name: next
        type: string
      responses:
        "302":
          description: Found
      summary: Sign in through the identity provider
      tags:
      - Auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Invalidates all existing sessions of the user, with revokeTokens
        also the API tokens.
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.UpdatePasswordRequest'
      responses:
        "204":
          description: No Content
        "409":
          description: the account signs in through single sign-on only
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "422":
          description: current password is wrong or the new one is too weak
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change the own password
      tags:
      - Auth
  /auth/tokens:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.TokenView'
            type: array
      security:
      - BearerAuth: []
      summary: List own API tokens
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: |-
        Use it as "Authorization: Bearer <token>". The value is returned only once. Only a session can
        create tokens: a token cannot extend its own access.
      parameters:
      - description: Token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.CreatedToken'
      security:
      - BearerAuth: []
      summary: Create an API token
      tags:
      - Auth
  /auth/tokens/{id}:
    delete:
      parameters:
      - description: Token id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an API token
      tags:
      - Auth
  /branding:
    get:
      description: |-
        Public (also shown on the sign-in page). The footer always names the software (Kubedactyl).
        Sends an ETag: with If-None-Match it answers 304 while nothing changed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Branding'
      summary: Name, tagline, logo and favicon of the panel
      tags:
      - Settings
  /cluster:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ClusterInfo'
      security:
      - BearerAuth: []
      summary: Cluster information
      tags:
      - Cluster
  /cluster/health:
    get:
      description: |-
        CRDs, permissions, nodes, metrics-server, load balancer pools and storage classes (cached for 30
        seconds).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clusterinfo.Health'
      security:
      - BearerAuth: []
      summary: Health of the panel's dependencies
      tags:
      - Cluster
  /cluster/identity:
    get:
      description: |-
        Kubeconfig or service account in use, authentication method (secrets are never returned), TLS, the
        identity reported by the API server (SelfSubjectReview) and the permissions the panel needs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clusterinfo.Identity'
      security:
      - BearerAuth: []
      summary: Connection and identity of the panel
      tags:
      - Cluster
  /cluster/nodes:
    get:
      description: |-
        Nodes with roles, status, capacity, requested resources, live usage (metrics-server) and hardware
        (CPU model, vendor, product) plus totals. Ready nodes without hardware data are probed in the
        background.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clusterinfo.NodesResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cluster nodes
      tags:
      - Cluster
  /cluster/nodes/probe:
    post:
      description: |-
        Starts a short-lived, unprivileged probe pod on every ready node that reads /proc/cpuinfo and
        /sys/class/dmi. Waits for the results (up to 90 seconds).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clusterinfo.NodesResponse'
      security:
      - BearerAuth: []
      summary: Read the hardware of all nodes again
      tags:
      - Cluster
  /egg-library:
    get:
      description: |-
        Reads the GitHub repositories set in the settings (eggLibraries). Each is kept in the panel's
        memory for 15 minutes; refresh=true downloads them again.
      parameters:
      - description: download the repositories again
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.LibraryList'
      security:
      - BearerAuth: []
      summary: List the eggs of the egg library
      tags:
      - Eggs
  /egg-library/egg:
    get:
      parameters:
      - description: repository URL
        in: query
        name: repository
        required: true
        type: string
      - description: path of the egg file in the repository
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.LibraryEgg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an egg of the egg library
      tags:
      - Eggs
  /eggs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.EggList'
      security:
      - BearerAuth: []
      summary: List eggs
      tags:
      - Eggs
    post:
      consumes:
      - application/json
      description: |-
        Creates an egg from the fields of the editor (also used to duplicate one). The object name is
        derived from the display name; a new UUID is assigned.
      parameters:
      - description: Egg
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1alpha1.EggSpec'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1alpha1.Egg'
        "422":
          description: validation errors per field
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an egg
      tags:
      - Eggs
  /eggs/{egg}:
    delete:
      parameters:
      - description: Egg name
        in: path
        name: egg
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "409":
          description: egg is used by servers
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an egg
      tags:
      - Eggs
    get:
      parameters:
      - description: Egg name
        in: path
        name: egg
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1alpha1.Egg'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an egg
      tags:
      - Eggs
    put:
      consumes:
      - application/json
      description: |-
        Replaces the fields of an egg. Servers use the changes from their next start (install script: next
        reinstall). UUID and import details are kept.
      parameters:
      - description: Egg name
        in: path
        name: egg
        required: true
        type: string
      - description: Egg
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1alpha1.EggSpec'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1alpha1.Egg'
        "422":
          description: validation errors per field
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an egg
      tags:
      - Eggs
  /eggs/{egg}/export:
    get:
      description: |-
        yaml / json: Pelican format PLCN_v3 (same content); ptdl: Pterodactyl format PTDL_v2 (JSON).
        download=true sends it as file.
      parameters:
      - description: Egg name
        in: path
        name: egg
        required: true
        type: string
      - description: yaml (default), json or ptdl
        in: query
        name: format
        type: string
      - description: Send as attachment
        in: query
        name: download
        type: boolean
      produces:
      - text/plain
      responses:
        "200":
          description: egg file
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Export an egg
      tags:
      - Eggs
  /eggs/{egg}/update-from-url:
    post:
      description: |-
        Downloads the egg from meta.update_url and replaces all fields, including changes made in the
        panel. Name and UUID are kept.
      parameters:
      - description: Egg name
        in: path
        name: egg
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1alpha1.Egg'
        "409":
          description: the egg has no update URL
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an egg from its update URL
      tags:
      - Eggs
  /eggs/import:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: |-
        Accepts a Pterodactyl (PTDL_v1/v2) or Pelican (PLCN_v1-v3) egg as JSON or YAML, either as request
        body or as multipart field "file". An egg with the same name is updated.
      parameters:
      - description: Egg file
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: an egg with the same name was updated
          schema:
            $ref: '#/definitions/v1alpha1.Egg'
        "201":
          description: a new egg was created
          schema:
            $ref: '#/definitions/v1alpha1.Egg'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Import an egg file
      tags:
      - Eggs
  /eggs/import-url:
    post:
      consumes:
      - application/json
      parameters:
      - description: Egg URL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.ImportURLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1alpha1.Egg'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Import an egg from a URL
      tags:
      - Eggs
  /health:
    get:
      description: Reports whether the panel process is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.HealthResponse'
      summary: Health check
      tags:
      - System
  /info:
    get:
      description: Name, version and run mode (public, so nothing else is revealed).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.InfoResponse'
      summary: Panel information
      tags:
      - System
  /invites:
    get:
      description: Open and expired invites, newest first. The links themselves are
        not stored.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.InviteView'
            type: array
      security:
      - BearerAuth: []
      summary: List invites
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: |-
        The link (/invite?token=<token>) lets someone create an account once within 7 days. The token
        is returned only once.
      parameters:
      - description: Invite
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.CreatedInvite'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an invite link
      tags:
      - Users
  /invites/{invite}:
    delete:
      parameters:
      - description: Invite id
        in: path
        name: invite
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an invite
      tags:
      - Users
  /invites/{invite}/renew:
    post:
      description: |-
        Replaces the link of an invite (the old one stops working) and makes it valid for 7 days again,
        also after it expired. The new token is returned only once.
      parameters:
      - description: Invite id
        in: path
        name: invite
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.CreatedInvite'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Renew an invite link
      tags:
      - Users
  /legal:
    get:
      description: |-
        Public (also shown on the sign-in page). Markdown; empty when not configured.
        Sends an ETag: with If-None-Match it answers 304 while nothing changed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.LegalTexts'
      summary: Legal notice and privacy policy
      tags:
      - Settings
  /request-rates:
    get:
      description: |-
        Averages over the last 5 seconds; refused requests and waiting calls count, too. This request
        does not count. Panel is set for administrators only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.RequestRates'
      security:
      - BearerAuth: []
      summary: Request rates
      tags:
      - Settings
  /servers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.GameServerList'
      security:
      - BearerAuth: []
      summary: List game servers
      tags:
      - Servers
    post:
      consumes:
      - application/json
      description: Creates the server and runs the egg install script. Variables are
        validated against the egg rules.
      parameters:
      - description: Server
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateServerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1alpha1.GameServer'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a game server
      tags:
      - Servers
  /servers/{server}:
    delete:
      description: Deletes the server including its data volume.
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a game server
      tags:
      - Servers
    get:
      parameters:
      - description: Server name
        in: path
        name: server
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1alpha1.GameServer'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a game server
