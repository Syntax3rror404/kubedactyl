      - description: Server name
        in: path
        name: server
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ServerStats'
      security:
      - BearerAuth: []
      summary: Live resource usage
      tags:
      - Servers
