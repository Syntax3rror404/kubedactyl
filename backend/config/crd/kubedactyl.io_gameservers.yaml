---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gameservers.kubedactyl.io
spec:
  group: kubedactyl.io
  names:
    kind: GameServer
    listKind: GameServerList
    plural: gameservers
    shortNames:
    - kgs
    singular: gameserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.eggRef
      name: Egg
      type: string
    - jsonPath: .spec.state
      name: State
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.suspended
      name: Suspended
      type: boolean
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GameServer is a game server instance created from an Egg.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GameServerSpec defines the desired state of a game server.
            properties:
              crashRestart:
                default: true
                description: CrashRestart restarts the server after a crash (not twice
                  within 60 seconds).
                type: boolean
              displayName:
                description: 'DisplayName is the name shown in the panel. Empty: uses
                  the object name.'
                type: string
              eggRef:
                description: EggRef is the name of the Egg in the same namespace.
                type: string
              environment:
                additionalProperties:
                  type: string
                description: Environment holds the values of the egg variables. Missing
                  ones use the egg's defaults.
                type: object
              externalTrafficPolicy:
                description: 'ExternalTrafficPolicy of the server''s service. Empty:
                  uses Local. Admins only.'
                enum:
                - Local
                - Cluster
                type: string
              image:
                description: Image is the runtime image (one of the egg's docker images
                  or a custom one).
                type: string
              installRevision:
                default: 1
                description: InstallRevision reinstalls the server whenever it differs
                  from status.installedRevision.
                format: int64
                type: integer
              ipv6:
                description: |-
                  IPv6 gives the server an address of each IP family the cluster has (PreferDualStack). Only with
                  a dual stack cluster and a pool with an IPv6 block. Admins only.
                type: boolean
              loadBalancerIP:
                description: |-
                  LoadBalancerIP fixes the server's addresses: one IP, or one per IP family separated by a comma,
                  from the load balancer pool. Empty: the pool picks.
                type: string
              loadBalancerPool:
                description: |-
                  LoadBalancerPool is the Cilium LB IPAM pool the address comes from. The service gets the labels
                  of the pool's service selector.
                type: string
              ports:
                description: Ports are published as TCP and UDP. The first one is
                  the primary port (SERVER_PORT).
                items:
                  format: int32
                  type: integer
                minItems: 1
                type: array
              resources:
                description: Resources of a game server.
                properties:
                  cpuMillis:
                    description: CPUMillis limits the CPU of the server (millicores,
                      1000 = one core). 0 = unlimited.
                    format: int64
                    type: integer
                  diskMiB:
                    description: DiskMiB is the size of the server's volume (MiB).
                    format: int64
                    minimum: 256
                    type: integer
                  memoryMiB:
                    description: MemoryMiB is the memory of the server (MiB), also
                      passed to it as SERVER_MEMORY.
                    format: int64
                    minimum: 64
                    type: integer
                required:
                - diskMiB
                - memoryMiB
                type: object
              schedules:
                description: Schedules run tasks at fixed times or events of the server.
                items:
                  description: |-
                    Schedule runs its tasks one after another whenever the cron expression matches or, with
                    Event set, at a moment of the server's life (shown as "Tasks" in the web interface).
                  properties:
                    cron:
                      description: |-
                        Cron is a five-field cron expression ("0 4 * * *") or a descriptor like "@daily",
                        evaluated in the panel's time zone. Either Cron or Event is set.
                      type: string
                    enabled:
                      description: Enabled schedules run automatically; disabled ones
                        can still be run by hand.
                      type: boolean
                    event:
                      description: |-
                        Event runs the schedule when the server was marked as running ("started") or before it
                        is stopped or restarted ("stopping"; the stop waits until the tasks are done).
                      enum:
                      - started
                      - stopping
                      type: string
                    name:
                      description: Name identifies the schedule within the server.
                      maxLength: 50
                      minLength: 1
                      type: string
                    onlyWhenOnline:
                      description: OnlyWhenOnline skips the run when the server is
                        not running.
                      type: boolean
                    tasks:
                      items:
                        description: ScheduleTask is one step of a schedule.
                        properties:
                          action:
                            description: Action is a console command, a power action
                              or a backup.
                            enum:
                            - command
                            - start
                            - stop
                            - restart
                            - kill
                            - backup
                            type: string
                          delaySeconds:
                            description: DelaySeconds waits before this task, counted
                              from the end of the previous one (seconds).
                            format: int32
                            maximum: 900
                            minimum: 0
                            type: integer
                          payload:
                            description: Payload is the console command (action "command")
                              or the backup label (action "backup").
                            maxLength: 500
                            type: string
                        required:
                        - action
                        type: object
                      maxItems: 10
                      minItems: 1
                      type: array
                  required:
                  - enabled
                  - name
                  - tasks
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              serviceType:
                description: |-
                  ServiceType publishes the server through a load balancer or only inside the cluster (ClusterIP).
                  Empty: LoadBalancer. A ClusterIP server keeps its pool for when it gets a load balancer again.
                enum:
                - LoadBalancer
                - ClusterIP
                type: string
              skipInstall:
                description: SkipInstall creates the server without running the egg's
                  install script.
                type: boolean
              startup:
                description: 'Startup replaces the egg''s startup command. Empty:
                  uses StartupName.'
                type: string
              startupName:
                description: |-
                  StartupName picks one of the egg's startup commands by name. Empty or unknown: uses the egg's
                  default. Ignored when Startup is set.
                type: string
              state:
                default: Stopped
                description: State is the power state the server should be in.
                enum:
                - Running
                - Stopped
                type: string
              stopTimeoutSeconds:
                default: 600
                description: |-
                  StopTimeoutSeconds is how long the server may take to stop after the stop command before it
                  is killed (seconds).
                format: int64
                type: integer
              storageClass:
                description: |-
                  StorageClass of the server's volume. Changing it moves the files to a new volume of that class
                  (status.migration); the server is locked meanwhile. Admins only.
                type: string
              suspended:
                description: Suspended stops the server and locks it for its owner.
                  Admins only.
                type: boolean
            required:
            - eggRef
            - image
            - ports
            - resources
            type: object
          status:
            description: GameServerStatus defines the observed state of a game server.
            properties:
              address:
                description: |-
                  Address is the external IP assigned by the load balancer (the first of Addresses), or the
                  service's DNS name inside the cluster (<service>.<namespace>.svc) for a ClusterIP server.
                type: string
              addresses:
                description: Addresses are all external IPs assigned by the load balancer
                  (one per IP family).
                items:
                  type: string
                type: array
              diskMeasuredAt:
                format: date-time
                type: string
              diskUsedBytes:
                description: |-
                  DiskUsedBytes is the last measured size of the server files (bytes). It is measured only
                  while the files pod runs, which happens on demand.
                format: int64
                type: integer
              installExitCode:
                description: InstallExitCode is the exit code of the last install
                  script run.
                format: int32
                type: integer
              installedRevision:
                description: InstalledRevision is the last completed install revision.
                format: int64
                type: integer
              lastCrashAt:
                description: LastCrashAt is the time of the last detected crash.
                format: date-time
                type: string
              lastExitCode:
                description: LastExitCode is the exit code of the last terminated
                  game process.
                format: int32
                type: integer
              message:
                type: string
              migration:
                description: Migration is the running or last failed storage migration.
                properties:
                  done:
                    description: Done is the number of files copied so far, Total
                      the number of all files.
                    format: int64
                    type: integer
                  error:
                    description: Error tells why the migration failed. The server
                      stays on its old volume.
                    type: string
                  from:
                    description: From is the storage class the server moves away from,
                      To the one it moves to.
                    type: string
                  previousVolume:
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  step:
                    description: |-
                      Step is Preparing (stopping the server, creating the new volume), Copying, Switching (binding
                      the server to the new volume) or Failed.
                    enum:
                    - Preparing
                    - Copying
                    - Switching
                    - Failed
                    type: string
                  to:
                    type: string
                  total:
                    format: int64
                    type: integer
                  volume:
                    description: Volume is the new persistent volume, PreviousVolume
                      the old one (both set when switching).
                    type: string
                required:
                - from
                - startedAt
                - step
                - to
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is the observed state of a game server.
                type: string
              podUID:
                description: PodUID identifies the current game pod.
                type: string
              restartRequired:
                description: |-
                  RestartRequired is set while the running game pod was created with other runtime
                  settings (image, startup, variables, memory, CPU, ports) than the spec has now.
                type: boolean
              schedules:
                description: Schedules holds the last run of every schedule.
                items:
                  description: ScheduleStatus is the result of the last run of a schedule.
                  properties:
                    lastResult:
                      description: 'LastResult is "ok", "skipped: <reason>" or "failed:
                        <reason>".'
                      type: string
                    lastRunAt:
                      format: date-time
                      type: string
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              startedAt:
                description: StartedAt is when the current game pod was created.
                format: date-time
                type: string
              stopRequestedAt:
                description: StopRequestedAt is set when a graceful stop was sent
                  to the current pod.
                format: date-time
                type: string
              stopTasksStartedAt:
                description: |-
                  StopTasksStartedAt is set while the "stopping" schedules of the current pod run; the
                  stop is sent when they are done.
                format: date-time
                type: string
              storageClass:
                description: StorageClass of the bound volume. While spec.storageClass
                  differs, the server is migrating.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
