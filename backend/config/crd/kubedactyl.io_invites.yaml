---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: invites.kubedactyl.io
spec:
  group: kubedactyl.io
  names:
    kind: Invite
    listKind: InviteList
    plural: invites
    shortNames:
    - kinvite
    singular: invite
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.username
      name: Username
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.expiresAt
      name: Expires
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Invite lets someone create a panel account once, until it expires.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              InviteSpec is a one-time link with which someone creates their own account, or sets a new password for it
              (Reset). The object name is the public id in the link's token.
            properties:
              createdBy:
                description: CreatedBy is the user who created the invite.
                type: string
              expiresAt:
                format: date-time
                type: string
              hash:
                description: Hash is a SHA-256 hash of the link's token; the token
                  itself is never stored.
                type: string
              note:
                description: Note says whom the invite is for (shown to administrators
                  only).
                type: string
              owner:
                description: 'Owner invites a subuser of that user (role user). Empty:
                  a normal account.'
                type: string
              reset:
                description: Reset sets a new password for the existing account Username
                  instead of creating one.
                type: boolean
              role:
                default: user
                description: UserRole is the permission level of a panel user.
                enum:
                - admin
                - user
                type: string
              shares:
                description: Shares are the servers of the owner the subuser sees
                  once the account exists.
                items:
                  description: InviteShare is a server of the owner shared with the
                    invited subuser.
                  properties:
                    access:
                      default: view
                      description: ShareAccess is what a subuser may do on a server
                        shared with them.
                      enum:
                      - view
                      - control
                      type: string
                    server:
                      description: Server is the name of the server.
                      type: string
                  required:
                  - access
                  - server
                  type: object
                maxItems: 100
                type: array
              username:
                description: Username is the name the account gets; empty lets the
                  invited person choose it.
                type: string
            required:
            - expiresAt
            - hash
            - role
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
