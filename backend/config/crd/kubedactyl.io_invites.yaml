  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: invites.kubedactyl.io
spec:
  group: kubedactyl.io
  names:
    kind: Invite
    listKind: InviteList
    plural: invites
    shortNames:
    - kinvite
    singular: invite
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.username
